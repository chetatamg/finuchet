name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # Указываем корень репозитория как рабочую директорию
          working-directory: .
